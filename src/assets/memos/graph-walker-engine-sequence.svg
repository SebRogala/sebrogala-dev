<svg viewBox="0 0 980 600">
  <defs>
    <marker id="gw-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--fg)"/></marker>
    <marker id="gw-ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--muted)"/></marker>
    <marker id="gw-ahs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--live-dot)"/></marker>
    <marker id="gw-ahj" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--accent)"/></marker>
  </defs>
  <!-- heads -->
  <rect class="box o" x="20" y="14" width="180" height="50" rx="5"/><text class="head" x="110" y="36" text-anchor="middle">Orchestrator</text><text class="sub" x="110" y="54" text-anchor="middle">Claude opus-5-5</text>
  <rect class="box" x="270" y="14" width="180" height="50" rx="5"/><text class="head" x="360" y="36" text-anchor="middle">pipeforge walk</text><text class="sub" x="360" y="54" text-anchor="middle">CLI, background Bash</text>
  <rect class="box" x="520" y="14" width="180" height="50" rx="5"/><text class="head" x="610" y="36" text-anchor="middle">pipeforge MCP server</text><text class="sub" x="610" y="54" text-anchor="middle">sequenced run, owns the graph</text>
  <rect class="box" x="770" y="14" width="190" height="50" rx="5"/><text class="head" x="865" y="36" text-anchor="middle">Seats</text><text class="sub" x="865" y="54" text-anchor="middle">herdr Codex panes, gpt-6.1-sol</text>
  <line class="lifeline" x1="110" y1="64" x2="110" y2="585"/><line class="lifeline" x1="360" y1="64" x2="360" y2="585"/>
  <line class="lifeline" x1="610" y1="64" x2="610" y2="585"/><line class="lifeline" x1="865" y1="64" x2="865" y2="585"/>
  <!-- setup -->
  <line class="ar" x1="110" y1="100" x2="606" y2="100" marker-end="url(#gw-ah)"/>
  <text class="lbl" x="124" y="93">pipeforge run-create --source=&lt;pipeline&gt;.v0.json … → runId</text>
  <line class="ar" x1="110" y1="140" x2="356" y2="140" marker-end="url(#gw-ah)"/>
  <text class="lbl" x="124" y="133">pipeforge walk &lt;runId&gt; --agent-bridge=…</text>
  <line class="ar srv" x1="360" y1="178" x2="606" y2="178" marker-end="url(#gw-ahs)"/>
  <text class="lbl" x="374" y="171">acquireWalkerLease → fence</text>
  <!-- loop -->
  <rect class="loop" x="240" y="196" width="725" height="285" rx="6"/>
  <text class="loopt" x="250" y="212">repeat until { done }: the server picks every next block</text>
  <line class="ar srv" x1="610" y1="232" x2="364" y2="232" marker-end="url(#gw-ahs)"/>
  <text class="lbl" x="420" y="226">next occurrence {blockId, body}</text>
  <path class="ar" d="M360,258 h40 v22 h-36" marker-end="url(#gw-ah)"/>
  <text class="lbl" x="408" y="273">shell atom: wi-gate, commit-wi, unit-integrate …</text>
  <line class="ar" x1="360" y1="310" x2="861" y2="310" marker-end="url(#gw-ah)"/>
  <text class="lbl" x="374" y="303">agent: host writes dispatch-N.json + prompt-N.md, delivers to a pane</text>
  <line class="ar ret" x1="865" y1="345" x2="364" y2="345" marker-end="url(#gw-ahm)"/>
  <text class="lbl" x="560" y="339">seat runs pipeforge bridge-answer → result-N.json</text>
  <line class="ar jdg" x1="360" y1="384" x2="114" y2="384" marker-end="url(#gw-ahj)"/>
  <text class="lbl" x="124" y="378">judgment: dispatch-N.json</text>
  <line class="ar ret" x1="110" y1="414" x2="356" y2="414" marker-end="url(#gw-ahm)"/>
  <text class="lbl" x="124" y="408">bridge-answer --outcome=…</text>
  <line class="ar srv" x1="360" y1="455" x2="606" y2="455" marker-end="url(#gw-ahs)"/>
  <text class="lbl" x="374" y="448">reportOccurrenceOutcome (or …HostFailure)</text>
  <!-- end -->
  <line class="ar srv" x1="610" y1="508" x2="364" y2="508" marker-end="url(#gw-ahs)"/>
  <text class="lbl" x="420" y="502">{ done } → walker writes walk.out, exits</text>
  <path class="ar ret" d="M110,532 h40 v26 h-36" marker-end="url(#gw-ahm)"/>
  <text class="lbl" x="158" y="549">watcher: until ls dispatch-N.* …; sleep 15</text>
  <text class="sub" x="158" y="567">wake → read dispatch / walk.out → re-arm</text>
  </svg>
