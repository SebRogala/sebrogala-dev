server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Behind Traefik (Coolify): TLS terminates upstream, so $scheme inside this
    # container is "http". Without these directives, nginx emits absolute Location
    # headers with that internal http scheme, causing https → http downgrade for
    # any auto-generated 301 (directory add-slash, our trailing-slash rewrite, etc.).
    # `absolute_redirect off` makes redirects relative ("/foo" instead of
    # "http://host/foo"), so the browser preserves its original scheme.
    absolute_redirect off;
    server_name_in_redirect off;
    port_in_redirect off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Cache static assets aggressively (Astro generates hashed filenames)
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(js|css|woff|woff2|ttf|otf|svg|png|jpg|jpeg|gif|webp|avif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Canonicalise trailing slashes: /foo/ → /foo (root / stays as /).
    # Relative redirect (because of `absolute_redirect off`) so https is preserved.
    rewrite ^/(.+)/$ /$1 permanent;

    # Resolve directories via explicit $uri/index.html lookup — DO NOT use
    # `$uri/` as a fallback, because that match triggers nginx's built-in
    # add-trailing-slash 301, undoing the canonicalisation above.
    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    # Security headers
    # HSTS: 1 year, applies to subdomains too. Browsers refuse plaintext
    # connections to sebrogala.dev (and any future subdomain) for the duration.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Custom 404 page (Astro will generate this if you add src/pages/404.astro)
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
