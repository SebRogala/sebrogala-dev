services:
  dev:
    image: node:22-alpine
    container_name: sebrogala_dev
    working_dir: /app
    volumes:
      - .:/app
      - sebrogala_node_modules:/app/node_modules
    command: sh -c "npm install --prefer-offline --no-audit && npm run dev"
    networks:
      - infra
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sebrogala.rule=Host(`sebrogala.localhost`)"
      - "traefik.http.routers.sebrogala.entrypoints=websecure"
      - "traefik.http.routers.sebrogala.tls=true"
      - "traefik.http.services.sebrogala.loadbalancer.server.port=4321"
    restart: unless-stopped

networks:
  infra:
    external: true

volumes:
  sebrogala_node_modules:
